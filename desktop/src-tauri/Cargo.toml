[package]
name = "music-desktop"
version = "0.3.0"
description = "Music desktop app"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac", "aiff"] }
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
souvlaki = "0.9.3"
crossbeam-channel = "0.5.17"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
discord-rich-presence = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[features]
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
