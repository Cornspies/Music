# nginx in front of the Music server, with a maintenance switch.
#
# Install: copy this file to /etc/nginx/conf.d/ (or sites-available/), set
# server_name and the certificates, and copy the maintenance/ folder next to
# it to /var/www/music-maintenance/. maintenance.sh turns maintenance on and
# off. README.md → Maintenance.
#
# While /var/www/music-maintenance/maintenance.json exists, every request is
# answered here and the server can be stopped. API calls get that file as a
# 503, which the web, desktop and mobile apps show as "down for maintenance,
# back around <time>". Pages get index.html, which shows the same and reloads
# once the site is back. When the server is down without maintenance being on,
# pages get index.html too ("not responding"), and API calls get nginx's 502,
# which the apps show as "can't reach the server".

# The desktop app's origins, which the server allows cross-origin calls from.
# The maintenance notice needs the same, or the app can't read it. Add any
# origins from MUSIC_CORS_ORIGINS here as well.
map $http_origin $music_app_origin {
    ~*^(tauri://localhost|https?://tauri\.localhost)$ $http_origin;
    default "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;

    # The server sets its own limits per upload and per user.
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uploads go straight through, and long imports and streams aren't cut off.
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Audio streams aren't spooled to disk.
    proxy_max_temp_file_size 0;

    location /api/ {
        set $music_maintenance "";
        if (-f /var/www/music-maintenance/maintenance.json) {
            set $music_maintenance "on";
        }
        if ($request_method = OPTIONS) {
            set $music_maintenance "${music_maintenance}-preflight";
        }
        # The desktop app asks before each call with a token; the server
        # usually answers that.
        if ($music_maintenance = "on-preflight") {
            add_header Access-Control-Allow-Origin $music_app_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range, If-None-Match" always;
            add_header Vary Origin always;
            return 204;
        }
        if ($music_maintenance = "on") {
            return 503;
        }
        proxy_pass http://127.0.0.1:3001;
        # Only nginx's own 503 is replaced: the server's answers pass through.
        # A URI here, not a named location, so uploads and other POSTs get
        # the notice too (nginx turns them into a GET for it).
        error_page 503 /maintenance.json;
    }

    location / {
        if (-f /var/www/music-maintenance/maintenance.json) {
            return 503;
        }
        proxy_pass http://127.0.0.1:3001;
        error_page 502 503 504 /maintenance.html;
    }

    # The notice itself; a 404 when maintenance is off. The page reads it too.
    location = /maintenance.json {
        root /var/www/music-maintenance;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        add_header Access-Control-Allow-Origin $music_app_origin always;
        add_header Vary Origin always;
        try_files /maintenance.json =404;
    }

    location = /maintenance.html {
        internal;
        alias /var/www/music-maintenance/index.html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}
