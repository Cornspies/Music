# Linux-only checks for everything except iOS. Runs only by hand from the
# Actions tab, so pushes don't use up Actions minutes. The iOS build has its
# own workflow (macOS runners are billed 10x).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/music-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/music-server/go.mod
          # The module isn't at the repository root, where setup-go looks by default.
          cache-dependency-path: backend/music-server/go.sum
      - run: go build ./... && go vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx next build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # v5, not v6: v6 moved caching into a proprietary component under Gradle's terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Music-Android-debug
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
