# Builds the iOS app on a GitHub-hosted Mac — the one platform that can't be
# compiled anywhere else. Simulator build, so no Apple signing is needed;
# what it proves is that the Kotlin/Native framework and the Swift shell
# compile and link. Signed device builds for TestFlight are in testflight.yml.
#
# macOS minutes cost 10x Linux minutes, so this runs only by hand from the
# Actions tab.
name: iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # v5, not v6: v6 moved caching into a proprietary component under Gradle's terms of use.
      - uses: gradle/actions/setup-gradle@v5

      # The Kotlin/Native toolchain is a large download; keep it between runs.
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}

      # Third-party: pinned to a commit, since a moved tag could run anything.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: mobile/iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | xcbeautify --renderer github-actions

      - name: Upload the simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Music-iOS-simulator
          path: mobile/iosApp/build/Build/Products/Debug-iphonesimulator/Music.app
          if-no-files-found: error
