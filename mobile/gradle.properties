# Project-wide Gradle settings.

# Memory for the Gradle daemon (Kotlin/Compose builds are memory hungry).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Faster builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin.
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.dependency.useConstraints=false

# The iOS simulator test task can't run on Linux; don't warn about it.
kotlin.native.ignoreDisabledTargets=true

# Kotlin/Native debug links use 4 backend threads unless told otherwise, which
# warns on 3-core CI Macs; 0 means one thread per available processor.
kotlin.native.parallelThreads=0

musicHost=music.cornspies.com
org.gradle.configuration-cache=true
