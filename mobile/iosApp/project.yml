# XcodeGen spec for the iOS app shell. The .xcodeproj is generated from this
# (`xcodegen generate` in this folder) and is not committed: a generated
# project can't drift, and it can be produced on a CI Mac without anyone
# owning one. Everything in here mirrors the official Compose Multiplatform
# iOS template — the Kotlin framework is built by a run-script phase that
# calls Gradle before the Swift sources compile.
name: iosApp
options:
  bundleIdPrefix: com.cornspies.music
  deploymentTarget:
    iOS: "15.6"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    # Xcode 15+ sandboxes run-script phases by default, which stops the
    # Gradle step from writing the framework into the build products.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework only has arm64 slices (iosArm64/iosSimulatorArm64;
    # Compose Multiplatform no longer supports x86_64). Without this, a generic
    # simulator build also asks Gradle for x86_64, which fails the Gradle step.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    SWIFT_VERSION: "5.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        # The Info.plist is hand-maintained (background audio, ATS, URL
        # scheme); XcodeGen must not generate one over it.
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Hand-maintained too; the App ID and the provisioning profile must
        # have every capability it lists.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.cornspies.music
        PRODUCT_NAME: Music Player
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "0.4.0
        DEVELOPMENT_TEAM: $(TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        # iPhone only: with "1,2" (iPhone and iPad) App Store Connect also wants
        # 13-inch iPad screenshots. iPads still run it as an iPhone app. iPad
        # support can be added in a later version, but never removed once a
        # version with it is on the App Store.
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator builds only: skiko's simulator library carries one object
        # (ICU's data table, no code) stamped for iOS 18.5, and the linker
        # warns when linking it for anything older. Devices keep 15.6.
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "18.5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Where Gradle puts ComposeApp.framework for the current configuration/SDK.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        shell: /bin/sh
        # Not "based on dependency analysis": Xcode can't know about Kotlin
        # sources, so this must run every build; Gradle itself is incremental.
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    scheme:
      configVariants: []
